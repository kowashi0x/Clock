<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="referrer" content="no-referrer">
  <title>Dashboard</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      background: #050508;
      color: #fff;
      font-family: 'Segoe UI', 'Meiryo', 'Hiragino Kaku Gothic ProN', sans-serif;
      margin: 0;
      padding: 0;
      width: 920px;
      height: 600px;
      overflow: hidden;
    }

    .dashboard {
      display: flex;
      width: 920px;
      height: 600px;
      padding: 14px;
      gap: 14px;
    }

    /* 左側：1ヶ月カレンダー */
    .calendar-panel {
      width: 470px;
      height: 100%;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      background: rgba(20, 20, 30, 0.75);
      border: 1px solid #1f293d;
      border-radius: 16px;
      padding: 14px;
    }

    .calendar-title {
      font-size: 50px;
      font-weight: bold;
      color: #ffffff;
      text-align: center;
      margin-top: 16px;
      margin-bottom: 32px;
      line-height: 1.15;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      grid-auto-rows: 1fr;
      gap: 6px;
      flex: 0.9;
      min-height: 0;
    }

    .day-header {
      display: flex;
      align-items: center;
      justify-content: right;
      padding-right: 10px;
      font-weight: bold;
      font-size: 30px;
      color: #fff;
    }
    .day-header.sun { color: #ff0000; }
    .day-header.sat { color: #0000ff; }

    .cell {
      display: flex;
      align-items: center;
      justify-content: right;
      padding: 2px 10px 2px 4px;
      background: #0d1117;
      border: 1px solid #1b2230;
      border-radius: 6px;
      font-size: 35px;
      font-weight: bold;
      color: #00ff00;
    }

    .cell.empty {
      background: #090c10;
      border-color: #12161f;
      color: transparent;
    }

    .cell.today {
      background: #1a0500;
      border: 2px solid #ff6633;
      color: #ff0000;
      box-shadow: 0 0 12px rgba(255, 68, 0, 0.7);
    }

    /* 右側：上から 時間＋曜日 → 天気 → ニュース */
    .right-panel {
      flex: 1;
      height: 100%;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
      background: rgba(20, 20, 30, 0.75);
      border: 1px solid #1f293d;
      border-radius: 16px;
      padding: 14px 18px;
    }

    /* 1. 時間＋曜日 */
    .time-row {
      display: flex;
      align-items: baseline;
      gap: 14px;
      line-height: 1.05;
      flex-shrink: 0;
    }

    .time {
      font-size: 62px;
      font-weight: bold;
      letter-spacing: 1px;
      text-align: left;
    }
    .time_HH { color: #ffffff; }
    .time_MM { color: #ffa500; }
    .time_SS { color: #ffff00; }

    .weekday {
      font-size: 40px;
      font-weight: bold;
      color: #00ff00;
      letter-spacing: 1px;
    }
    .weekday.sun { color: #ff0000; }
    .weekday.sat { color: #0000ff; }

    /* 2. 天気（大阪・京都を2行・大きめ文字で表示） */
    .weather {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
      font-size: 24px;
      font-weight: bold;
      color: #76ff03;
      background: rgba(118, 255, 3, 0.08);
      border: 1px solid rgba(118, 255, 3, 0.3);
      border-radius: 12px;
      padding: 8px 14px;
      line-height: 1.3;
      text-align: left;
    }

    .weather-line {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .temp-highlight {
      font-size: 28px;
      color: #ffff00;
    }

    /* 3. ニュース（全体の約半分の高さ） */
    .news-panel {
      height: 285px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .news-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      color: #ff9d00;
    }

    .news-badge {
      background: #ff7b00;
      color: #000;
      font-weight: 900;
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 4px;
      margin-right: 6px;
    }

    .news-updated-bar {
      font-size: 28px;
      font-weight: 900;
      color: #ffcc66;
      background: rgba(255, 140, 0, 0.12);
      border-left: 4px solid #ff8c00;
      padding: 4px 12px;
      border-radius: 6px;
      line-height: 1.2;
      letter-spacing: 0.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .led-board {
      flex: 1;
      min-height: 0;
      position: relative;
      background: #0a0602;
      border: 2px solid #2b1d0e;
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      align-items: center;
    }

    .ticker-link {
      position: absolute;
      left: 0;
      white-space: nowrap;
      text-decoration: none;
      color: #ff8c00;
      font-size: 64px;
      font-weight: 900;
      letter-spacing: 2px;
      will-change: transform;
    }
  </style>
</head>
<body>
  <div class="dashboard">
    <!-- 左：カレンダー -->
    <div class="calendar-panel">
      <div class="calendar-title" id="calendar-title">--年 --月 --日</div>
      <div class="calendar-grid" id="calendar"></div>
    </div>

    <!-- 右：時間＋曜日 → 天気 → ニュース -->
    <div class="right-panel">
      <div class="time-row">
        <div class="weekday" id="weekday">-</div>
        <div class="time" id="time">--:--:--</div>
      </div>

      <div class="weather" id="weather">
        <div class="weather-line">大阪: 取得中...</div>
        <div class="weather-line">京都: 取得中...</div>
      </div>

      <div class="news-panel">
        <div class="news-header">
          <div>
            <span class="news-badge">NEWS</span>
            <span id="news-counter">[ -- / -- ]</span>
          </div>
          <span id="news-status">待機中...</span>
        </div>
        <div class="news-updated-bar" id="news-updated-time">発表時間: --:--</div>
        <div class="led-board" id="led-board">
          <a class="ticker-link" id="ticker-item" target="_blank" rel="noopener noreferrer">
            ニュース待機中...
          </a>
        </div>
      </div>
    </div>
  </div>

  <script>
    const GAS_API_URL = 'https://script.googleusercontent.com/macros/echo?user_content_key=AUkAhnTsWKn8g7pT95EMOO1jweyQIl0CrciNl6u8q2IfAJkqidJbl_VJSOXU6Kr9wOzhDqb6I0vM7LDTkNqY4nHnUSV6luctynyD06VMM5rxCtQTRpFgCpx2xath9TXfSp8y7hvlPX9nBiSe57N74AoEvCy7iEiq6nlvZ8LR-lEqIQJAU0Z_H8SfZKuN9RQsEDtTgU7YNjQLWfwBCi6Uul6f1WnQANDJVYzjLBqhmLr3Dh537gk9Fx4-Hs59XuME4m1wcD6x3zxg9PofjPxNOeWeBQB755TNvQ&lib=MyQ7tZ_wQaCrJZ-kOtxTklmvRDGiYonds';
    const SCROLL_SPEED = 180;

    let lastDateKey = '';
    let newsList = [];
    let currentIndex = 0;
    let currentX = 0;
    let textWidth = 0;
    let lastTimestamp = null;
    let animationStarted = false;

    function generateCalendar(now) {
      try {
        const year = now.getFullYear();
        const month = now.getMonth();
        const todayDate = now.getDate();

        const titleEl = document.getElementById('calendar-title');
        const calendarEl = document.getElementById('calendar');
        if (!titleEl || !calendarEl) return;

        titleEl.textContent = `${year}年 ${month + 1}月 ${todayDate}日`;
        calendarEl.innerHTML = '';

        const weekDays = ['日', '月', '火', '水', '木', '金', '土'];
        weekDays.forEach((day, idx) => {
          const header = document.createElement('div');
          header.className = 'day-header';
          if (idx === 0) header.classList.add('sun');
          if (idx === 6) header.classList.add('sat');
          header.textContent = day;
          calendarEl.appendChild(header);
        });

        const firstDayOfWeek = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();

        for (let i = 0; i < firstDayOfWeek; i++) {
          const emptyCell = document.createElement('div');
          emptyCell.className = 'cell empty';
          emptyCell.textContent = '0';
          calendarEl.appendChild(emptyCell);
        }

        for (let date = 1; date <= daysInMonth; date++) {
          const cell = document.createElement('div');
          cell.className = 'cell';
          cell.textContent = String(date);
          if (date === todayDate) {
            cell.classList.add('today');
          }
          calendarEl.appendChild(cell);
        }
      } catch (e) {
        // カレンダー描画エラー時も時計は継続
      }
    }

    function updateClock() {
      try {
        const now = new Date();
        const days = ['日', '月', '火', '水', '木', '金', '土'];
        const dayIndex = now.getDay();
        const hh = String(now.getHours()).padStart(2, '0');
        const mm = String(now.getMinutes()).padStart(2, '0');
        const ss = String(now.getSeconds()).padStart(2, '0');

        const timeEl = document.getElementById('time');
        if (timeEl) {
          timeEl.innerHTML =
            `<span class="time_HH">${hh}</span>:<span class="time_MM">${mm}</span>:<span class="time_SS">${ss}</span>`;
        }

        const weekdayEl = document.getElementById('weekday');
        if (weekdayEl) {
          weekdayEl.textContent = days[dayIndex];
          weekdayEl.classList.remove('sun', 'sat');
          if (dayIndex === 0) weekdayEl.classList.add('sun');
          if (dayIndex === 6) weekdayEl.classList.add('sat');
        }

        const dateKey = `${now.getFullYear()}-${now.getMonth() + 1}-${now.getDate()}`;
        if (lastDateKey !== dateKey) {
          generateCalendar(now);
          lastDateKey = dateKey;
        }
      } catch (e) {
        // 時計エラー時は無視
      }
    }

    function getWeatherText(code) {
      if (code === 0) return '晴れ ☀️';
      if ([1, 2, 3].includes(code)) return '晴れ/曇り ⛅';
      if ([45, 48].includes(code)) return '霧 🌫️';
      if ([51, 53, 55, 61, 63, 65, 80, 81, 82].includes(code)) return '雨 🌧️';
      if ([71, 73, 75, 77, 85, 86].includes(code)) return '雪 ❄️';
      if ([95, 96, 99].includes(code)) return '雷雨 ⚡';
      return '曇り ☁️';
    }

    async function updateWeather() {
      const weatherEl = document.getElementById('weather');
      if (!weatherEl) return;

      try {
        const osakaUrl = 'https://api.open-meteo.com/v1/forecast?latitude=34.6937&longitude=135.5023&current=temperature_2m,weather_code&timezone=Asia%2FTokyo';
        const kyotoUrl = 'https://api.open-meteo.com/v1/forecast?latitude=35.0116&longitude=135.7681&current=temperature_2m,weather_code&timezone=Asia%2FTokyo';

        const [osakaRes, kyotoRes] = await Promise.all([
          fetch(osakaUrl),
          fetch(kyotoUrl)
        ]);

        const osakaData = await osakaRes.json();
        const kyotoData = await kyotoRes.json();

        const osakaTemp = Math.round(osakaData.current.temperature_2m);
        const osakaWeather = getWeatherText(osakaData.current.weather_code);
        const kyotoTemp = Math.round(kyotoData.current.temperature_2m);
        const kyotoWeather = getWeatherText(kyotoData.current.weather_code);

        weatherEl.innerHTML =
          `<div class="weather-line">大阪: ${osakaWeather} <span class="temp-highlight">${osakaTemp}℃</span></div>` +
          `<div class="weather-line">京都: ${kyotoWeather} <span class="temp-highlight">${kyotoTemp}℃</span></div>`;
      } catch (err) {
        weatherEl.textContent = '大阪・京都: 天気取得失敗';
      }
    }

    function formatPublishedTime(item) {
      if (!item) return '--:--';
      const raw =
        item.pubDate ||
        item.publishedAt ||
        item.published ||
        item.date ||
        item.time ||
        item.updated ||
        '';
      if (!raw) return '--:--';

      const parsed = new Date(raw);
      if (!Number.isNaN(parsed.getTime())) {
        const hh = String(parsed.getHours()).padStart(2, '0');
        const mm = String(parsed.getMinutes()).padStart(2, '0');
        return `${hh}:${mm}`;
      }
      return String(raw);
    }

    function updatePublishedDisplay(item) {
      const updatedEl = document.getElementById('news-updated-time');
      if (updatedEl) {
        updatedEl.textContent = `発表時間: ${formatPublishedTime(item)}`;
      }
    }

    function setupNewsItem() {
      if (!newsList.length) return;
      const boardEl = document.getElementById('led-board');
      const tickerEl = document.getElementById('ticker-item');
      const counterEl = document.getElementById('news-counter');
      if (!boardEl || !tickerEl) return;

      const item = newsList[currentIndex];
      if (counterEl) {
        counterEl.textContent = `[ ${String(currentIndex + 1).padStart(2, '0')} / ${String(newsList.length).padStart(2, '0')} ]`;
      }
      updatePublishedDisplay(item);
      tickerEl.href = item.link || '#';
      tickerEl.textContent = item.title || '(タイトルなし)';

      const boardWidth = boardEl.clientWidth || 380;
      textWidth = tickerEl.offsetWidth || 300;
      currentX = boardWidth + 10;
      tickerEl.style.transform = `translateX(${currentX}px)`;
    }

    function animateNews(timestamp) {
      if (!lastTimestamp) lastTimestamp = timestamp;
      const deltaSec = Math.min((timestamp - lastTimestamp) / 1000, 0.1);
      lastTimestamp = timestamp;

      const tickerEl = document.getElementById('ticker-item');
      if (tickerEl && newsList.length > 0) {
        currentX -= SCROLL_SPEED * deltaSec;
        tickerEl.style.transform = `translateX(${currentX}px)`;

        if (currentX < -textWidth - 20) {
          currentIndex = (currentIndex + 1) % newsList.length;
          setupNewsItem();
        }
      }
      requestAnimationFrame(animateNews);
    }

    async function fetchNews() {
      const statusEl = document.getElementById('news-status');
      const updatedEl = document.getElementById('news-updated-time');
      const tickerEl = document.getElementById('ticker-item');
      if (statusEl) statusEl.textContent = '取得中...';

      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 8000);

      try {
        const res = await fetch(GAS_API_URL, { signal: controller.signal });
        clearTimeout(timer);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        const data = await res.json();
        if (!Array.isArray(data) || data.length === 0) {
          throw new Error('データが空です');
        }

        newsList = data.slice(0, 12);
        if (statusEl) {
          statusEl.textContent = `取得完了 (${newsList.length}件)`;
        }
        updatePublishedDisplay(newsList[0]);

        if (!animationStarted) {
          currentIndex = 0;
          setupNewsItem();
          animationStarted = true;
          requestAnimationFrame(animateNews);
        }
      } catch (err) {
        clearTimeout(timer);
        if (statusEl) {
          statusEl.textContent = err.name === 'AbortError' ? 'タイムアウト' : '取得失敗';
        }
        if (updatedEl) {
          updatedEl.textContent = '発表時間: --:--';
        }
        if (tickerEl) {
          tickerEl.textContent = 'ニュースを取得できませんでした';
        }
      }
    }

    updateClock();
    setInterval(updateClock, 1000);
    updateWeather();
    setInterval(updateWeather, 15 * 60 * 1000);
    fetchNews();
    setInterval(fetchNews, 30 * 60 * 1000);
  </script>
</body>
</html>
