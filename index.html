<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Cyber Calendar & Clock</title>
  <style>
    body {
      background: #050508;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      width: 920px; /* 必要最小限の幅まで縮小 */
      height: 600px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
    }

    /* メインコンテナ */
    .dashboard {
      display: flex;
      width: 100%;
      height: 100%;
      padding: 20px;
      gap: 20px;
      box-sizing: border-box;
    }

    /* 左側：LED風 1ヶ月カレンダーエリア */
    .calendar-panel {
      width: 480px;
      display: flex;
      flex-direction: column;
      background: rgba(20, 20, 30, 0.6);
      border: 1px solid #1f293d;
      border-radius: 16px;
      padding: 20px;
      box-sizing: border-box;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
    }

    .calendar-title {
      font-size: 48px;
      font-weight: bold;
      color: #ffff00;
      margin-bottom: 12px;
      text-align: center;
      letter-spacing: 1px;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
      flex: 1;
    }

    /* 曜日ヘッダー */
    .day-header {
      text-align: center;
      font-weight: bold;
      font-size: 42px;
      padding: 4px 0;
      color: #FFF;
    }
    .day-header.sun { color: #ff0000; }
    .day-header.sat { color: #0000ff; }

    /* カレンダーセル（LEDコマ風） */
    .cell {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0d1117;
      border: 1px solid #161b22;
      border-radius: 6px;
      font-size: 16px;
      color: #30363d;
      transition: all 0.3s ease;
    }

    /* 点灯コマ（当月の日付） */
    .cell.active {
      background: #000;
      border-color: #1f4b70;
      font-weight: bold;
      font-size: 42px;
       color: #00ff00;
      box-shadow: inset 0 0 6px rgba(0, 191, 255, 0.2);
    }

    /* 当日の強調コマ（LEDネオン発光） */
    .cell.today {
      background: #000;
      border-color: #ff6633;
      color: #ff0000;
      font-weight: bold;
      font-size: 42px;
      box-shadow: 0 0 15px rgba(255, 51, 0, 0.8), inset 0 0 8px rgba(255, 255, 255, 0.5);
      transform: scale(1.08);
      z-index: 2;
    }

    /* 右側：時計・天気エリア（幅を縮め、左詰めに変更） */
    .clock-panel {
      flex: 1; /* 残りのスペースを使用 */
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start; /* すべて左詰め */
      background: rgba(20, 20, 30, 0.6);
      border: 1px solid #1f293d;
      border-radius: 16px;
      box-shadow: 0 0 20px rgba(0, 255, 204, 0.05);
      padding: 25px 30px;
      box-sizing: border-box;
    }

    .date {
      font-size: 96px;
      font-weight: bold;
      color: #0000FF;
      text-shadow: 0 0 12px rgba(0, 255, 204, 0.4);
      line-height: 1;
    }

    .day {
      font-size: 64px;
      font-weight: bold;
      color: #ffff00;
      margin-top: 5px;
      text-shadow: 0 0 10px rgba(255, 165, 0, 0.4);
      line-height: 1;
    }

    .time {
      font-size: 76px;
      font-weight: bold;
      margin-top: 20px;
      letter-spacing: 1px;
      line-height: 1;
    }
    .time_HH { color: #FFFFFF; }
    .time_MM { color: #ffa500; text-shadow: 0 0 10px rgba(255, 165, 0, 0.5); }
    .time_SS { color: #FFFF00; text-shadow: 0 0 10px rgba(0, 191, 255, 0.5); }

    .weather {
      font-size: 24px;
      font-weight: bold;
      color: #76ff03;
      margin-top: 20px;
      background: rgba(118, 255, 3, 0.1);
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid rgba(118, 255, 3, 0.3);
      text-shadow: 0 0 8px rgba(118, 255, 3, 0.4);
      line-height: 1.4;
      width: 100%;
      box-sizing: border-box;
    }

    .temp-highlight {
      font-size: 32px;
      color: #FFFF00;
      font-weight: bold;
      text-shadow: 0 0 8px rgba(255, 0, 0, 0.5);
    }
  </style>
</head>
<body>

  <div class="dashboard">
    <!-- 左パネル：1ヶ月カレンダー -->
    <div class="calendar-panel">
      <div class="calendar-title" id="calendar-title">--年 --月</div>
      <div class="calendar-grid" id="calendar"></div>
    </div>

    <!-- 右パネル：時計・日付・天気（左詰め＆コンパクト化） -->
    <div class="clock-panel">
      <div class="date" id="date">--/--</div>
      <div class="day" id="day">---</div>
      <div class="time" id="time">--:--</div>
      <div class="weather" id="weather">大阪<br>取得中...<br>京都<br>取得中...</div>
    </div>
  </div>

  <script>
    function updateClock() {
      const now = new Date();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      const days = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
      const hh = String(now.getHours()).padStart(2, '0');
      const mm = String(now.getMinutes()).padStart(2, '0');
      const SS = String(now.getSeconds()).padStart(2, '0');

      document.getElementById('date').textContent = `${m}/${d}`;
      document.getElementById('day').textContent = days[now.getDay()];

      document.getElementById('time').innerHTML = `
        <span class="time_HH">${hh}</span>:<span class="time_MM">${mm}</span>:<span class="time_SS">${SS}</span>
      `;

      // 日付が変わったらカレンダーも更新
      if (window.lastDate !== d) {
        generateCalendar(now);
        window.lastDate = d;
      }
    }

    // 1ヶ月カレンダー生成
    function generateCalendar(now) {
      const year = now.getFullYear();
      const month = now.getMonth();
      const todayDate = now.getDate();

      document.getElementById('calendar-title').textContent = `${year}年 ${month + 1}月`;

      const calendarEl = document.getElementById('calendar');
      calendarEl.innerHTML = '';

      // 曜日ヘッダー
      const weekDays = ['日', '月', '火', '水', '木', '金', '土'];
      weekDays.forEach((day, idx) => {
        const header = document.createElement('div');
        header.className = 'day-header';
        if (idx === 0) header.classList.add('sun');
        if (idx === 6) header.classList.add('sat');
        header.innerText = day;
        calendarEl.appendChild(header);
      });

      const firstDayOfWeek = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      // 前月の空コマ
      for (let i = 0; i < firstDayOfWeek; i++) {
        const emptyCell = document.createElement('div');
        emptyCell.className = 'cell';
        calendarEl.appendChild(emptyCell);
      }

      // 当月の日付コマ
      for (let date = 1; date <= daysInMonth; date++) {
        const cell = document.createElement('div');
        cell.className = 'cell active';
        cell.innerText = date;

        if (date === todayDate) {
          cell.classList.add('today');
        }

        calendarEl.appendChild(cell);
      }
    }

    // 天気取得
    function getWeatherText(code) {
      if (code === 0) return '晴れ ☀️';
      if ([1, 2, 3].includes(code)) return '晴れ/曇り ⛅';
      if ([45, 48].includes(code)) return '霧 🌫️';
      if ([51, 53, 55, 61, 63, 65, 80, 81, 82].includes(code)) return '雨 🌧️';
      if ([71, 73, 75, 77, 85, 86].includes(code)) return '雪 ❄️';
      if ([95, 96, 99].includes(code)) return '雷雨 ⚡';
      return '曇り ☁️';
    }

    async function updateWeather() {
      try {
        const osakaUrl = 'https://api.open-meteo.com/v1/forecast?latitude=34.6937&longitude=135.5023&current=temperature_2m,weather_code&timezone=Asia%2FTokyo';
        const kyotoUrl = 'https://api.open-meteo.com/v1/forecast?latitude=35.0116&longitude=135.7681&current=temperature_2m,weather_code&timezone=Asia%2FTokyo';

        const [osakaRes, kyotoRes] = await Promise.all([
          fetch(osakaUrl),
          fetch(kyotoUrl)
        ]);

        const osakaData = await osakaRes.json();
        const kyotoData = await kyotoRes.json();

        const osakaTemp = Math.round(osakaData.current.temperature_2m);
        const osakaWeather = getWeatherText(osakaData.current.weather_code);

        const kyotoTemp = Math.round(kyotoData.current.temperature_2m);
        const kyotoWeather = getWeatherText(kyotoData.current.weather_code);

        document.getElementById('weather').innerHTML = `
          大阪<br>
          ${osakaWeather} <span class="temp-highlight">${osakaTemp}℃</span><br>
          京都<br>
          ${kyotoWeather} <span class="temp-highlight">${kyotoTemp}℃</span>
        `;
      } catch (error) {
        document.getElementById('weather').textContent = '天気取得失敗';
      }
    }

    // タイマー設定
    setInterval(updateClock, 1000);
    updateClock();

    updateWeather();
    setInterval(updateWeather, 15 * 60 * 1000);
  </script>
</body>
</html>
